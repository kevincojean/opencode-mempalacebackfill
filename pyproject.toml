[project]
name = "mempalace-backfill"
dynamic = ["version"]
description = "Backfill historical OpenCode sessions into MemPalace"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "inject>=4.3.0",
    "pymonad>=2.4.0",
    "rich>=13.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-xdist>=3.6.0"]

[dependency-groups]
test = ["pytest>=8.0.0", "pytest-xdist>=3.6.0"]

[project.scripts]
mempalace-backfill = "mempalace_backfill.backfill_application:app"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools-scm]
version_scheme = "no-guess-dev"

[tool.setuptools.packages.find]
where = ["src"]
